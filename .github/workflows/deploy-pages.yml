name: Deploy client (Vite) to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'client/**'
      - 'vite.config.ts'
      - '.github/workflows/deploy-pages.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (clean, reproducible)
        run: npm ci

      - name: Update Browserslist DB (optional)
        run: npx update-browserslist-db@latest || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate missing asset placeholders
        run: |
          set -euxo pipefail
          # Create placeholder files for any referenced images to prevent Vite ENOENT during CI
          if [ -f scripts/generate_asset_placeholders.cjs ]; then
            node ./scripts/generate_asset_placeholders.cjs
          elif [ -f scripts/generate_asset_placeholders.mjs ]; then
            node ./scripts/generate_asset_placeholders.mjs
          else
            echo "No placeholder generator script found; skipping"
          fi

      - name: Normalize schema type import (CI hotfix)
        run: |
          set -euxo pipefail
          if [ -f client/src/pages/PublicHealthDashboard.tsx ]; then
            node <<'NODE'
            const fs = require('fs');
            const path = 'client/src/pages/PublicHealthDashboard.tsx';
            try {
              let s = fs.readFileSync(path, 'utf8');
              const hasImport = /import\s+\{[\s\S]*?\}\s*(?:from\s+['\"]@shared\/schema['\"])?.*;?/m.test(s);
              const schemaBlock = s.match(/import\s+\{([\s\S]*?)\}\s*from\s+['\"]@shared\/schema['\"];?/m);
              // If there's an import block from @shared/schema that's not type-only, normalize it
              if (schemaBlock) {
                const names = schemaBlock[1]
                  .split(',')
                  .map(x => x.trim())
                  .filter(Boolean)
                  .join(', ');
                const replacement = `import type { ${names} } from '@shared/schema';`;
                s = s.replace(/import\s+\{([\s\S]*?)\}\s*from\s+['\"]@shared\/schema['\"];?/m, replacement);
                fs.writeFileSync(path, s);
                console.log('Normalized @shared/schema import to type-only in PublicHealthDashboard.tsx');
              } else {
                // As a last resort, if we detect an import block without a from clause near @shared/schema, repair it
                const orphan = s.match(/import\s+\{([\s\S]*?)\}\s*;?\s*\n/m);
                if (orphan && s.includes('@shared/schema')) {
                  const names = orphan[1]
                    .split(',')
                    .map(x => x.trim())
                    .filter(Boolean)
                    .join(', ');
                  const fixed = `import type { ${names} } from '@shared/schema';\n`;
                  s = s.replace(/import\s+\{([\s\S]*?)\}\s*;?\s*\n/m, fixed);
                  fs.writeFileSync(path, s);
                  console.log('Repaired malformed import block in PublicHealthDashboard.tsx');
                }
              }
            } catch (e) {
              console.log('No normalization needed or file not found:', e?.message || e);
            }
            NODE
          fi

      - name: Build Vite client (with fallback)
        run: |
          set -euxo pipefail
          node -v
          npm -v
          npx vite --version || true
          # Prefer package scripts, then fallback to npx vite
          export SKIP_PUBLIC_HEALTH_DASHBOARD=1
          npm run build:client --if-present || npm run build --if-present || npx vite build

      - name: Prepare site artifact (dist/public with fallback)
        run: |
          set -euxo pipefail
          mkdir -p _site
          if [ -d dist/public ]; then
            rsync -a --delete dist/public/ _site/
          elif [ -d dist ]; then
            rsync -a --delete dist/ _site/
          else
            echo "Build output not found; showing dist listing (if any)" || true
            ls -la dist || true
            exit 1
          fi
          # Ensure CNAME is included for custom domain
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi
          # SPA/404 fallback to avoid 404s on deep links
          if [ -f _site/index.html ] && [ ! -f _site/404.html ]; then cp _site/index.html _site/404.html; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
