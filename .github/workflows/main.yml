name: Deploy client (Vite) to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'client/**'
      - 'vite.config.ts'
      - '.github/workflows/main.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (clean, reproducible)
        run: npm ci

      - name: Update Browserslist DB (optional)
        run: npx update-browserslist-db@latest || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Normalize PublicHealthDashboard file and schema import
        run: |
          set -euxo pipefail
          # If the PublicHealthDashboard file exists without extension, give it .tsx to help the bundler
          if [ -f client/src/pages/PublicHealthDashboard ] && [ ! -f client/src/pages/PublicHealthDashboard.tsx ]; then
            mv client/src/pages/PublicHealthDashboard client/src/pages/PublicHealthDashboard.tsx
            echo "Renamed PublicHealthDashboard to .tsx"
          fi
          # If the TSX exists, normalize any schema imports to type-only to avoid bundling issues
          if [ -f client/src/pages/PublicHealthDashboard.tsx ]; then
            node <<'NODE'
            const fs = require('fs');
            const path = 'client/src/pages/PublicHealthDashboard.tsx';
            try {
              let s = fs.readFileSync(path, 'utf8');
              const schemaImportRe = /import\s+\{([\s\S]*?)\}\s*from\s+['"]@shared\/schema['"];?/m;
              if (schemaImportRe.test(s)) {
                const names = s.match(schemaImportRe)[1]
                  .split(',')
                  .map(x => x.trim())
                  .filter(Boolean)
                  .join(', ');
                const replacement = `import type { ${names} } from '@shared/schema';`;
                s = s.replace(schemaImportRe, replacement);
                fs.writeFileSync(path, s);
                console.log('Normalized @shared/schema import to type-only');
              }
            } catch (e) {
              console.log('Normalization step skipped:', e?.message || e);
            }
            NODE
          fi

      - name: Build Vite client (with fallback)
        run: |
          set -euxo pipefail
          # Show available scripts for debugging
          npm run || true
          export SKIP_PUBLIC_HEALTH_DASHBOARD=1
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['build:client']?0:1)"; then
            npm run build:client
          elif node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['build']?0:1)"; then
            npm run build
          else
            npx vite build
          fi

      - name: Prepare site artifact (dist/public with fallback)
        run: |
          set -euxo pipefail
          mkdir -p _site
          if [ -d dist/public ]; then
            rsync -a --delete dist/public/ _site/
          elif [ -d dist ]; then
            rsync -a --delete dist/ _site/
          else
            echo "Build output not found; showing dist listing (if any)" || true
            ls -la dist || true
            exit 1
          fi
          # Include custom domain if present
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi
          # SPA fallback for deep links
          if [ -f _site/index.html ] && [ ! -f _site/404.html ]; then cp _site/index.html _site/404.html; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
